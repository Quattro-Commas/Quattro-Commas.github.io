name: verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Offline verification gate (links + required content)
        run: bash scripts/verify.sh

      - name: Detector proof (--negative must exit 1; 2 means broken)
        run: |
          bash scripts/verify.sh --negative && code=0 || code=$?
          if [ "$code" -eq 1 ]; then
            echo "detector proof OK (exit 1 as designed)"
          else
            echo "detector proof FAILED (exit $code, expected 1; 2 = detector broken)"
            exit 1
          fi
